server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax

spring:
  application:
    name: mfa
  datasource:
    url: jdbc:h2:file:./data/session
    username: sa
    password: ""
  session:
    jdbc:
      initialize-schema: always