apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: property-platform
  template:
    metadata:
      labels:
        app: property-platform
    spec:
      containers:
        - name: property-platform
          image: registry.example.com/property-platform:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: APP_MAINTENANCE_GRPC_TARGET
              value: maintenance-service:9090
            - name: SPRING_AI_OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OTLP_METRICS_URL
              value: http://otel-lgtm:4318/v1/metrics
            - name: OTLP_TRACES_URL
              value: http://otel-lgtm:4318/v1/traces
            - name: OTLP_LOGS_URL
              value: http://otel-lgtm:4318/v1/logs
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: property-platform-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: property-platform
spec:
  selector:
    app: property-platform
  ports:
    - port: 80
      targetPort: 8080