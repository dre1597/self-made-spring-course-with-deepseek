server:
  port: 8081
spring:
  application:
    name: maintenance-service
  grpc:
    server:
      port: 9090
  datasource:
    url: jdbc:h2:mem:maintenance;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false